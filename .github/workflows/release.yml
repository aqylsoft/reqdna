name: Release

on:
  workflow_call:
    outputs:
      VERSION:
        value: ${{ jobs.create.outputs.VERSION }}

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.versionNumber.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -race ./...

      - uses: 8BitJonny/gh-get-current-pr@4.0.0
        id: PR
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.event.pull_request.head.sha }}
          filterOutClosed: false
          filterOutDraft: true

      - name: Get last release version and compute next
        if: success() && steps.PR.outputs.pr_found == 'true'
        id: versionNumber
        run: |
          VERSION=$(curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name // "v0.0.0"')
          echo "Last release: $VERSION"
          regexVersion="v([0-9]+)\.([0-9]+)\.?([0-9]+)?"
          if [[ $VERSION =~ $regexVersion ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            build="${BASH_REMATCH[3]}"
          fi
          if [ -n "$build" ]; then
            build=$((build + 1))
            NEWVERSION="v$major.$minor.$build"
          else
            minor=$((minor + 1))
            NEWVERSION="v$major.$minor"
          fi
          echo "Next version: $NEWVERSION"
          echo "VERSION=$NEWVERSION" >> $GITHUB_ENV
          echo "VERSION=$NEWVERSION" >> $GITHUB_OUTPUT

      - name: Create release ${{ env.VERSION }}
        if: success() && steps.PR.outputs.pr_found == 'true'
        run: |
          if [ -z "${{ env.VERSION }}" ]; then
            echo "Failed to determine version" >&2
            exit 1
          fi
          body="${{ fromJSON(steps.PR.outputs.pr).head.ref }}"
          branchRegex="^([a-zA-Z]+)-([0-9]+)$"
          if [[ "${{ fromJSON(steps.PR.outputs.pr).head.ref }}" =~ $branchRegex ]]; then
            body="[${{ fromJSON(steps.PR.outputs.pr).head.ref }}](https://github.com/${{ github.repository }}/tree/${{ fromJSON(steps.PR.outputs.pr).head.ref }})"
          fi
          response=$(curl --write-out '%{http_code}' -s -o /tmp/release_response.json -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"${{ env.VERSION }}\",\"name\":\"${{ env.VERSION }}\",\"body\":\"$body\",\"draft\":false,\"prerelease\":false,\"generate_release_notes\":true}")
          cat /tmp/release_response.json
          if [[ "$response" -ne 201 ]]; then
            echo "Failed to create release (HTTP $response)" >&2
            exit 1
          fi
          echo "Released: ${{ env.VERSION }}"

      - name: Notify Go proxy
        if: success() && steps.PR.outputs.pr_found == 'true'
        run: |
          curl -s "https://proxy.golang.org/github.com/aqylsoft/reqdna/@v/${{ env.VERSION }}.info" || true
          curl -s "https://sum.golang.org/lookup/github.com/aqylsoft/reqdna@${{ env.VERSION }}" || true
