name: Auto Tag

# Runs on every push to master.
# Reads the version declared in reqdna.go (const Version = "x.y.z"),
# and creates an annotated git tag vX.Y.Z if it does not already exist.
# The new tag then triggers release.yml automatically.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from reqdna.go
        id: version
        run: |
          VERSION=$(grep -oP 'Version\s*=\s*"\K[^"]+' reqdna.go)
          if [ -z "$VERSION" ]; then
            echo "Could not extract Version from reqdna.go" >&2
            exit 1
          fi
          echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: v${VERSION}"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.VERSION }} already exists, skipping."
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.VERSION }} does not exist, will create."
          fi

      - name: Create and push annotated tag
        if: steps.tag_check.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.VERSION }}" \
            -m "Release ${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.VERSION }}"
